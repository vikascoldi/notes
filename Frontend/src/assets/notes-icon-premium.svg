<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Notes app icon</title>
  <desc id="desc">Two overlapping rounded squares in deep indigo and blue-violet, with two negative-space line cuts on the front square suggesting a document, on a transparent background.</desc>

  <defs>
    <mask id="lineCuts">
      <rect x="0" y="0" width="512" height="512" fill="#FFFFFF"/>
      <rect x="146" y="232" width="150" height="22" rx="11" fill="#000000"/>
      <rect x="146" y="274" width="104" height="22" rx="11" fill="#000000"/>
    </mask>
  </defs>

  <rect x="124" y="52" width="336" height="336" rx="78" fill="#6D5EF5"/>
  <rect x="52" y="124" width="336" height="336" rx="78" fill="#161A33" mask="url(#lineCuts)"/>
</svg>
