<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Notes app logo</title>
  <desc id="desc">A rounded squircle badge with a violet-to-indigo gradient, a folded-page notch and two document line cuts, crossed by a bright cyan-to-lime accent bolt, with a soft glow behind it on a transparent background.</desc>

  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B7CFB"/>
      <stop offset="55%" stop-color="#6D5EF5"/>
      <stop offset="100%" stop-color="#2A2E7A"/>
    </linearGradient>

    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#7CF29C"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.42  0 0 0 0 0.36  0 0 0 0 0.96  0 0 0 0.55 0"/>
    </filter>

    <mask id="cuts">
      <rect x="0" y="0" width="512" height="512" fill="#FFFFFF"/>
      <path d="M330 96 L406 96 L406 172 Z" fill="#000000"/>
      <rect x="152" y="256" width="160" height="22" rx="11" fill="#000000"/>
      <rect x="152" y="298" width="108" height="22" rx="11" fill="#000000"/>
    </mask>
  </defs>

  <rect x="72" y="72" width="368" height="368" rx="98" fill="url(#badgeGrad)" filter="url(#glow)"/>

  <rect x="72" y="72" width="368" height="368" rx="98" fill="url(#badgeGrad)" mask="url(#cuts)"/>

  <path d="M188 372 L332 188 A26 26 0 0 1 372 220 L228 404 L182 414 Z" fill="url(#boltGrad)"/>
  <path d="M332 188 L372 220 L348 244 L308 210 Z" fill="#17B4C9"/>
</svg>
